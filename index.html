<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A09" />

    <!-- If the domain ever changes, update: canonical, og:url, og:image,
         twitter:image, both JSON-LD "url" fields, robots.txt Sitemap, and
         sitemap.xml <loc>. -->
    <link rel="canonical" href="https://picsly.netlify.app/" />

    <title>Picsly — Compress &amp; Convert Images Online, Free</title>
    <meta
      name="description"
      content="Free online image compressor. Shrink photos to an exact file size — 200 KB, 2 MB, any ceiling — or convert to JPEG, PNG, WebP and AVIF. Batch up to 50 files, all in your browser, nothing uploaded."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Picsly" />
    <meta property="og:title" content="Picsly — Compress &amp; Convert Images Online, Free" />
    <meta
      property="og:description"
      content="Name your ceiling — 200 KB, 2 MB, whatever the form demands — and Picsly finds the highest quality that fits under it. Batch, private, 100% in your browser."
    />
    <meta property="og:url" content="https://picsly.netlify.app/" />
    <!-- Placeholder OG image: the square 512px logo. A dedicated 1200x630 banner
         would render far better on social cards — see the handoff note. -->
    <meta property="og:image" content="https://picsly.netlify.app/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Picsly — Compress &amp; Convert Images Online, Free" />
    <meta
      name="twitter:description"
      content="Compress images to an exact file size, or convert to JPEG, PNG, WebP and AVIF — free, batch, and 100% in your browser."
    />
    <meta name="twitter:image" content="https://picsly.netlify.app/icon-512.png" />

    <!-- Structured data: the app itself. No aggregateRating — there's no real
         rating data, so that field is intentionally omitted. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Picsly",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (runs in browser)",
        "description": "Free, private, browser-based image compressor and converter. Compress images to an exact file size, batch up to 50 at once, and output JPEG, PNG, WebP or AVIF with no uploads.",
        "featureList": [
          "Compress to an exact target file size",
          "Batch up to 50 images at once",
          "Output JPEG, PNG, WebP or AVIF",
          "HEIC input from iPhone",
          "Full-resolution before/after comparison",
          "Runs entirely in the browser — no uploads"
        ],
        "url": "https://picsly.netlify.app/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Structured data: FAQ. Mirrors src/components/FAQ.jsx — keep in sync if
         the questions change. NOTE: since 2023 Google limits FAQ rich results
         to authoritative government/health sites, so this likely won't render a
         visible rich snippet. It's included for general semantic clarity and
         other consumers — not a guaranteed rich-result win. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How can it compress without uploading anything?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your browser already knows how to decode and encode images — it does it every time you view a web page. Picsly draws your file onto an off-screen canvas and asks the browser to re-encode it at a chosen quality. The whole loop happens in the tab."
            }
          },
          {
            "@type": "Question",
            "name": "Will it land exactly on 200 KB?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It lands as close to your number as it can while staying under it, which is what upload forms actually check. If quality alone cannot get there, Picsly scales the image down in steps until it fits."
            }
          },
          {
            "@type": "Question",
            "name": "Which output format should I choose?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "WebP is the default because it is small and supported everywhere. Choose JPEG if a form is fussy about file types, PNG when you need lossless or transparency, and AVIF when you want the smallest possible file and control where it will be viewed."
            }
          },
          {
            "@type": "Question",
            "name": "Does it remove metadata?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Because the file is re-encoded from raw pixels, EXIF data — including camera model and GPS coordinates — does not survive the trip."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a file size or count limit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There is no server limit, because there is no server. Picsly takes up to 50 images at a time and up to 50 MB per file, which keeps even a big batch comfortable in your device's memory."
            }
          },
          {
            "@type": "Question",
            "name": "Is Picsly free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Free, with no account and no watermark. Since the work runs on your device, it costs nothing to run."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
