<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A09" />

    <!-- If the domain ever changes, update: canonical, og:url, og:image,
         twitter:image, both JSON-LD "url" fields, robots.txt Sitemap, and
         sitemap.xml <loc>. -->
    <link rel="canonical" href="https://picsly.netlify.app/" />

    <title>Picsly — Compress Images to an Exact File Size, Free</title>
    <meta
      name="description"
      content="Name your file size and Picsly hits it. Free browser-based image compressor: set a ceiling like 200 KB or 5 MB, batch up to 50 files, output JPEG, PNG, WebP or AVIF. Nothing is uploaded."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Picsly" />
    <meta property="og:title" content="Picsly — Compress Images to an Exact File Size, Free" />
    <meta
      property="og:description"
      content="Name your file size and Picsly hits it. Free browser-based image compressor: set a ceiling like 200 KB or 5 MB, batch up to 50 files, output JPEG, PNG, WebP or AVIF. Nothing is uploaded."
    />
    <meta property="og:url" content="https://picsly.netlify.app/" />
    <!-- Placeholder OG image: the square 512px logo. A dedicated 1200x630 banner
         would render far better on social cards — see the handoff note. -->
    <meta property="og:image" content="https://picsly.netlify.app/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Picsly — Compress Images to an Exact File Size, Free" />
    <meta
      name="twitter:description"
      content="Set a size ceiling and Picsly finds the best quality that fits. Free, batch, 100% in your browser."
    />
    <meta name="twitter:image" content="https://picsly.netlify.app/icon-512.png" />

    <!-- Structured data: the app itself. No aggregateRating — there's no real
         rating data, so that field is intentionally omitted. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Picsly",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (runs in browser)",
        "description": "Free, private, browser-based image compressor and converter. Compress images to an exact file size, batch up to 50 at once, and output JPEG, PNG, WebP or AVIF with no uploads.",
        "featureList": [
          "Compress to an exact target file size",
          "Batch up to 50 images at once",
          "Output JPEG, PNG, WebP or AVIF",
          "HEIC input from iPhone",
          "Full-resolution before/after comparison",
          "Runs entirely in the browser — no uploads"
        ],
        "url": "https://picsly.netlify.app/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Structured data: FAQ. Generated from src/components/FaqPage.jsx — if the
         questions change there, regenerate this block. NOTE: since 2023 Google
         limits FAQ rich results to authoritative sites, so this likely won't
         render a visible snippet; it's here for semantic clarity. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does my image get uploaded anywhere?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The compression runs in this browser tab using your own CPU. Turn your connection off after the page loads and it still works — that is the easiest way to prove it."
            }
          },
          {
            "@type": "Question",
            "name": "How does it hit an exact size?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It encodes the image, measures the result, and narrows in: a binary search across quality, up to nine attempts per file. If the ceiling is too tight for quality alone, it reduces the dimensions by 22% and searches again."
            }
          },
          {
            "@type": "Question",
            "name": "Why is my result under the limit rather than exactly on it?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Encoders are not perfectly predictable, so Picsly always lands just below your number rather than risking a file that is one byte over and gets rejected."
            }
          },
          {
            "@type": "Question",
            "name": "What about PNG?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PNG is lossless, so there is no quality dial to turn. Picsly can only reduce dimensions to reach a ceiling. If the size matters more than the format, switch the output to WebP or JPEG."
            }
          },
          {
            "@type": "Question",
            "name": "Can I convert HEIC from my iPhone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Safari decodes HEIC natively, and on Chrome and Firefox Picsly loads a decoder on demand, so iPhone photos convert on every major browser."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a limit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fifty files per batch and 50 MB per file. That cap exists to protect your tab, not to sell you an upgrade."
            }
          },
          {
            "@type": "Question",
            "name": "What does it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing. There is no account, no watermark and no paid tier holding back the good settings."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
